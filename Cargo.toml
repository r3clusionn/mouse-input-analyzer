[package]
name = "mouse-input-analyzer"
version = "0.1.0"
edition = "2021"
description = "Measure a mouse's real polling rate, jitter, gaps and motion from Windows Raw Input."
license = "MIT"

[lib]
name = "mia"

[[bin]]
name = "mia"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
strip = true
